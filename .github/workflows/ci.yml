name: CI backend

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          JWT_SECRET_KEY: ci-secret-no-produccion
      # PYSEC-2026-1325 (ecdsa, Minerva): el ataque requiere firmar/generar claves ECDSA, y
      # la app solo usa HS256 (ver app/core/security.py). Sin fix upstream. Riesgo aceptado.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
